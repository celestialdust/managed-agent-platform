# Migration runner config. Five later slices construct `Config(root / "alembic.ini")`
# and `plan.md`'s File Structure names this file, so its absence was a hole rather than a
# choice: the one path that creates these tables in RDS was the one path with no coverage,
# and `downgrade()` had none at all.
#
# No `sqlalchemy.url` here on purpose. The URL is a credential and lives in the
# environment (I1: nothing durable and no credential inside the pod that does not also
# exist outside it). `migrations/env.py` reads MAP_DATABASE_URL and fails loudly if it is
# unset, rather than falling back to a default that would silently target the wrong
# database.
[alembic]
script_location = migrations
# Explicit rather than inherited: without it alembic falls back to splitting the path on
# spaces, commas and colons, which silently breaks on any path containing one.
path_separator = os
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
